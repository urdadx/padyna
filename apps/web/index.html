<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>padyna</title>
  </head>

  <body>
    <div id="app"></div>

    <script>
      (function (w, d) {
        if (w.self !== w.top) {
          return;
        }

        if (w.location.pathname === "/widget") {
          return;
        }

        if (typeof w.Padyna !== "function") {
          var q = [];
          var stub = function () {
            q.push(arguments);
          };
          stub.q = q;
          w.Padyna = stub;
        }

        var sdk = d.createElement("script");
        sdk.src = "http://localhost:3001/sdk.js";
        sdk.async = true;
        d.head.appendChild(sdk);
      })(window, document);
    </script>
    <script>
      if (window.self === window.top && window.location.pathname !== "/widget") {
        window.Padyna("init", {
          widgetId: "pd_fZOZQJCgHpXo",
          serverUrl: "http://localhost:3001",
        });
      }
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
