server {
  listen 3000;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  location ~ ^/(privacy|terms-of-service)(/|/index\.html)?$ {
    add_header X-Robots-Tag "noindex, nofollow, noarchive, nosnippet" always;
    try_files $uri $uri/ $uri/index.html =404;
  }

  location / {
    try_files $uri $uri/ $uri/index.html =404;
  }
}
