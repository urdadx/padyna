# Requests asking for Markdown (Accept: text/markdown) get the page's Markdown copy, written at
# build time by apps/marketing/scripts/build-markdown.mjs; everyone else gets the HTML.
map $http_accept $wants_markdown {
  default 0;
  "~*text/markdown" 1;
}

server {
  listen 3000;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # The pages, as HTML or Markdown. Vary tells caches the answer depends on Accept.
  location = / {
    add_header Vary Accept always;
    if ($wants_markdown) {
      rewrite ^ /index.md last;
    }
    try_files /index.html =404;
  }

  location ~ ^/(privacy|terms-of-service|about|contact)/?$ {
    set $page $1;
    add_header Vary Accept always;
    if ($wants_markdown) {
      rewrite ^ /$page/index.md last;
    }
    try_files /$page/index.html =404;
  }

  location ~ \.md$ {
    types { }
    default_type "text/markdown; charset=utf-8";
    add_header Vary Accept always;
    try_files $uri =404;
  }

  # No public API on this site; answer API-style requests in JSON rather than an HTML page.
  location /api/ {
    default_type application/json;
    add_header Cache-Control "no-store" always;
    return 404 '{"error":{"code":"not_found","message":"padyna.com has no public API. Padyna is managed from the dashboard at https://app.padyna.com; see https://padyna.com/llms.txt for what is available."}}';
  }

  location / {
    try_files $uri $uri/ $uri/index.html =404;
  }
}
