server {
  listen 3000;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  location = /privacy {
    try_files /privacy/index.html =404;
  }

  location = /terms-of-service {
    try_files /terms-of-service/index.html =404;
  }

  location / {
    try_files $uri $uri/ $uri/index.html =404;
  }
}
